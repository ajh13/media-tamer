# See https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions

# NOTE: To enable SHA pinning enforcement at org level, use the GitHub UI:
#   Organization Settings > Actions > Policy > > Require SHA pinning
# This workflow pins all actions to full-length commit SHAs verified live via gh API.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege permissions: read contents only
permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Static checks: lint, format, extension validation ---
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint JS (ESLint flat config)
        run: npm run lint:js

      - name: Validate extension structure (no ES modules, no eval, manifest refs)
        run: npm run lint:ext

      - name: Format check (Prettier)
        run: npm run format:check

  # --- Unit tests: Node 24, test/unit only ---
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Dependency audit (dev-only, high+)
        run: npm audit --omit=dev --audit-level=high

  # --- Browser tests: real Firefox via Playwright ---
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox for Playwright
        run: npx playwright install --with-deps firefox

      - name: Run browser tests (Playwright Firefox)
        run: npm run test:browser

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
